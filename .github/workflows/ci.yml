name: CI

# Typecheck, the offline verify scripts, then a real production build.
#
# The verify scripts in scripts/ split cleanly in two, and only one half belongs
# on a push. capcheck, mergecheck, qrcheck, retrycheck and synccheck are
# properties of this source: denomination and cap arithmetic, note selection and
# merge rounds, QR round-tripping, the resume-never-restart rule that was written
# after a retry re-sent eight deposits that had already landed, and the rule that
# a balance refresh stops waiting and says so, written after every endpoint
# serving this chain's history refused at once and the spinner never stopped.
# They need no network and finish in under a second each.
#
# The rest are left out on purpose, and the reasons differ:
#   assets/holdings/price/rpc/relay/fee  read live chain, relayer or price data
#   sendcheck, crosscheck                build real proofs, so they pull the
#                                        52MB CRS and take minutes
#   crosscheck, tradecheck               import from ../../cli, which does not
#                                        exist in a clone of this repo alone
# They stay part of the manual pre-release pass. See the app README.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck, offline checks, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:offline
      # Builds the proving workers first, then the static export. This is the
      # step that catches a broken worker bundle, which typechecking cannot see
      # and which breaks proving for everyone the moment it ships.
      - run: npm run build

  supplychain:
    name: dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # No `npm ci`, deliberately. The install-script half reads package-lock.json
      # and nothing else, and installing the tree in order to check whether the
      # tree is safe to install would run the very scripts this is here to notice.
      #
      # This tree has eight of them, against the cli's two, and none of them
      # reach a user — a static export ships no Node. They run here, on the
      # machine that turns 900-odd packages into the bundle every browser runs,
      # which is the shortest path in this project from a bad package to
      # somebody's money.
      - run: node audits/supplychain/check.mjs
