name: CI

# Typecheck, the offline verify scripts, then a real production build.
#
# The verify scripts in scripts/ split cleanly in two, and only one half belongs
# on a push. capcheck, mergecheck, qrcheck, retrycheck, synccheck and maxcheck
# are properties of this source: denomination and cap arithmetic, note selection
# and merge rounds, QR round-tripping, the resume-never-restart rule that was
# written after a retry re-sent eight deposits that had already landed, the rule
# that a balance refresh stops waiting and says so, written after every endpoint
# serving this chain's history refused at once and the spinner never stopped,
# the rule that the way out never offers an amount two notes cannot carry, and
# the rule that a throttled endpoint falls through to the next one instead of
# stopping the chain, which cost minutes per operation when it did not, and the
# rule that the wallet card never reports less than the chain says is there.
# They need no network and finish in under a second each.
#
# The rest are left out on purpose, and the reasons differ:
#   assets/holdings/price/rpc/relay/fee  read live chain, relayer or price data
#   sendcheck                            builds real proofs, so it pulls the
#                                        52MB CRS and takes minutes
#   tradecheck                           imports from ../../cli, which does not
#                                        exist in a clone of this repo alone
# They stay part of the manual pre-release pass. See the app README.
#
# crosscheck used to be on both of those lists and is now its own job below.
# `--offline` drops the chain replay and the proof, and the second reason is
# answered by checking out both repositories instead of one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck, offline checks, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:offline
      # Builds the proving workers first, then the static export. This is the
      # step that catches a broken worker bundle, which typechecking cannot see
      # and which breaks proving for everyone the moment it ships.
      - run: npm run build

  parity:
    name: agrees with the CLI
    runs-on: ubuntu-latest
    # The one job here that reaches outside this repository, and it has to: what
    # it checks is that this browser port and the CLI compute the same numbers.
    #
    # It follows that a change on the CLI's main can turn this red without a
    # commit here, and that is the correct behaviour rather than a flaw in it.
    # The two implementations sharing a pool is the invariant; whichever side
    # moves first is the side that broke it, and finding out on a push is the
    # entire point of running this at all. The alternative — pinning the CLI to
    # a commit — would make this green while the app built witnesses the live
    # pool rejects.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: app
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Cowl-Protocol/cli
          persist-credentials: false
          path: cli
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # Both trees install: the crosscheck imports the CLI's TypeScript
      # directly, and those files import their own dependencies.
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: cli
      # --offline: no chain, no prover. Field, note, cipher, key and Merkle
      # parity only, which is seconds rather than minutes and needs nothing but
      # the two checkouts.
      - run: npx tsx scripts/crosscheck.mts --offline
        working-directory: app

  supplychain:
    name: dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # No `npm ci`, deliberately. The install-script half reads package-lock.json
      # and nothing else, and installing the tree in order to check whether the
      # tree is safe to install would run the very scripts this is here to notice.
      #
      # This tree has eight of them, against the cli's two, and none of them
      # reach a user — a static export ships no Node. They run here, on the
      # machine that turns 900-odd packages into the bundle every browser runs,
      # which is the shortest path in this project from a bad package to
      # somebody's money.
      - run: node audits/supplychain/check.mjs
